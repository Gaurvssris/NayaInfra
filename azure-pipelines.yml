

trigger:
- main

pool:
  name: NayaInfra

variables:
  imageName: independence-day-app
  tag: latest

steps:
- checkout: self

- task: Docker@2
  displayName: Build Docker Image
  inputs:
    command: build
    repository: $(imageName)
    Dockerfile: '$(Build.SourcesDirectory)/independence-day-app/Dockerfile'
    buildContext: '$(Build.SourcesDirectory)/independence-day-app'
    tags: |
      $(tag)

- powershell: |
    docker run -d --name independence-day-app -p 8085:80 $(imageName):$(tag)
  displayName: Run Docker Container

- powershell: |
    docker ps
  displayName: Verify Container
