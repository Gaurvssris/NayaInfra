

trigger:
- main

pool:
  name: NayaInfra

variables:
  imageName: independence-day-app
  tag: latest

steps:

- checkout: self

# Install Trivy
- powershell: |
    choco install trivy -y
  displayName: Install Trivy

# Scan Source Code
- powershell: |
    trivy fs --severity HIGH,CRITICAL .
  displayName: Trivy Filesystem Scan

# Build Docker Image
- task: Docker@2
  displayName: Build Docker Image
  inputs:
    command: build
    repository: $(imageName)
    Dockerfile: '$(Build.SourcesDirectory)/independence-day-app/Dockerfile'
    buildContext: '$(Build.SourcesDirectory)/independence-day-app'
    tags: |
      $(tag)

# Scan Docker Image
- powershell: |
    trivy image --severity HIGH,CRITICAL $(imageName):$(tag)
  displayName: Trivy Image Scan
# Run Container
- powershell: |
    docker run -d --name independence-day-app -p 8090:80 $(imageName):$(tag)
  displayName: Run Container

# Verify
- powershell: |
    docker ps
  displayName: Verify Container
