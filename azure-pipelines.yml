

trigger:
- main

pool:
  name: NayaInfra

variables:
  imageName: independence-app

steps:

- task: Docker@2
  displayName: Build Image
  inputs:
    command: build
    Dockerfile: Dockerfile
    repository: $(imageName)
    tags: |
      latest

- script: |
    docker images
  displayName: Show Images

- task: Docker@2
  displayName: Run Container
  inputs:
    command: run
    arguments: -d -p 8080:80 --name india $(imageName):latest
