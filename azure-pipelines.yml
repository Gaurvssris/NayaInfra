trigger:
- main

pool:
  name: NayaInfra

variables:
  workingDir: '$(System.DefaultWorkingDirectory)/environment/Dev'
  tflintVersion: '0.53.0'
  tfsecVersion: '1.28.10'
  pythonVersion: '3.12.7'

stages:
#==============================================================
# Stage-1 Validation & Security Scan
#==============================================================
- stage: Validation
  displayName: "Terraform Validation & Security"
  jobs:
  - job: Validate
    displayName: "Terraform Checks"
    steps:
    # Terraform Install
    - task: TerraformInstaller@1
      displayName: Install Terraform
      inputs:
        terraformVersion: '1.10.5'

    # Terraform Init
    - task: TerraformTask@5
      displayName: Terraform Init
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(workingDir)'
        backendServiceArm: 'NayaInfra'
        backendAzureRmStorageAccountName: 'gssstrg'
        backendAzureRmContainerName: 'gsscontainer'
        backendAzureRmKey: 'backup.tfstate'

    # Terraform Validate
    - task: TerraformTask@5
      displayName: Terraform Validate
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(workingDir)'

    # Install TFLint
    - task: PowerShell@2
      displayName: Install TFLint
      inputs:
        targetType: 'inline'
        script: |
          $ErrorActionPreference = "Stop"
          $version = "$(tflintVersion)"
          $url = "https://github.com/terraform-linters/tflint/releases/download/v$version/tflint_windows_amd64.zip"
          $zipPath = "$(Agent.TempDirectory)\tflint.zip"
          $installDir = "$(Agent.ToolsDirectory)\tflint\$version"

          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $installDir -Force

          Write-Host "##vso[task.prependpath]$installDir"

    # Run TFLint - only fail pipeline on actual errors, not warnings
    - task: PowerShell@2
      displayName: Run TFLint
      inputs:
        targetType: 'inline'
        script: |
          cd "$(workingDir)"
          tflint --version
          tflint --init
          tflint --minimum-failure-severity=error

    # Install TFSec
    - task: PowerShell@2
      displayName: Install TFSec
      inputs:
        targetType: 'inline'
        script: |
          $ErrorActionPreference = "Stop"
          $version = "$(tfsecVersion)"
          $url = "https://github.com/aquasecurity/tfsec/releases/download/v$version/tfsec-windows-amd64.exe"
          $installDir = "$(Agent.ToolsDirectory)\tfsec\$version"

          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          Invoke-WebRequest -Uri $url -OutFile "$installDir\tfsec.exe"

          Write-Host "##vso[task.prependpath]$installDir"

    # Run TFSec - soft-fail so findings are reported but don't break the build
    - task: PowerShell@2
      displayName: Run TFSec
      inputs:
        targetType: 'inline'
        script: |
          cd "$(workingDir)"
          tfsec.exe . --soft-fail

    # Install Python (direct silent installer instead of UsePythonVersion task,
    # since UsePythonVersion needs admin/registry rights this agent doesn't have)
    - task: PowerShell@2
      displayName: Install Python
      inputs:
        targetType: 'inline'
        script: |
          $ErrorActionPreference = "Stop"
          $version = "$(pythonVersion)"
          $installDir = "$(Agent.ToolsDirectory)\python\$version"

          if (Test-Path "$installDir\python.exe") {
            Write-Host "Python $version already installed, skipping."
          } else {
            $url = "https://www.python.org/ftp/python/$version/python-$version-amd64.exe"
            $installer = "$(Agent.TempDirectory)\python-installer.exe"

            Invoke-WebRequest -Uri $url -OutFile $installer

            New-Item -ItemType Directory -Force -Path $installDir | Out-Null

            # Silent, per-user-independent install into a custom target dir, no PATH/registry changes by installer
            Start-Process -FilePath $installer -ArgumentList @(
              "/quiet",
              "InstallAllUsers=0",
              "PrependPath=0",
              "Include_launcher=0",
              "Include_test=0",
              "TargetDir=$installDir"
            ) -Wait -NoNewWindow
          }

          Write-Host "##vso[task.prependpath]$installDir"
          Write-Host "##vso[task.prependpath]$installDir\Scripts"

    - task: PowerShell@2
      displayName: Verify Python
      inputs:
        targetType: 'inline'
        script: |
          python --version
          python -m pip --version

    # Install Checkov
    - task: PowerShell@2
      displayName: Install Checkov
      inputs:
        targetType: 'inline'
        script: |
          python -m pip install --upgrade pip
          python -m pip install checkov

    # Run Checkov - soft-fail so findings are reported but don't break the build
    - task: PowerShell@2
      displayName: Run Checkov
      inputs:
        targetType: 'inline'
        script: |
          cd "$(workingDir)"
          checkov -d . --soft-fail

#==============================================================
# Stage-2 Manual Approval
#==============================================================
- stage: Approval
  displayName: "Manual Approval"
  dependsOn: Validation
  jobs:
  - deployment: Approval
    displayName: "Wait For Approval"
    environment: Production
    strategy:
      runOnce:
        deploy:
          steps:
          - script: |
              echo "Approval Completed"
            displayName: Approval Completed

#==============================================================
# Stage-3 Terraform Plan
#==============================================================
- stage: Plan
  displayName: "Terraform Plan"
  dependsOn: Approval
  jobs:
  - job: TerraformPlan
    displayName: Terraform Plan
    steps:
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: '1.10.5'
    - task: TerraformTask@5
      displayName: Terraform Init
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(workingDir)'
        backendServiceArm: 'NayaInfra'
        backendAzureRmStorageAccountName: 'gssstrg'
        backendAzureRmContainerName: 'gsscontainer'
        backendAzureRmKey: 'backup.tfstate'
    - task: TerraformTask@5
      displayName: Terraform Plan
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(workingDir)'
        environmentServiceNameAzureRM: 'NayaInfra'