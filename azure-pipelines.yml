

trigger:
- main

pool:
  name: NayaInfra

steps:
- checkout: self

- task: Docker@2
  displayName: Build Docker Image
  inputs:
    command: build
    Dockerfile: '$(Build.SourcesDirectory)/independence-day-app/Dockerfile'
    buildContext: '$(Build.SourcesDirectory)/independence-day-app'
    repository: independence-day-app
    tags: |
      latest
