

# azure-pipelines.yml
trigger:
  - main

pool:
  name: NayaInfra   # NayaInfra self-hosted Windows agent

variables:
  trivyDir: '$(Build.SourcesDirectory)\trivy'

steps:

  # ---------------------------------------------------------
  # 1. Checkout source code
  # ---------------------------------------------------------
  - checkout: self
    displayName: 'Checkout Gaurvssris/NayaInfra@main'
    clean: true
    fetchDepth: 1

  # ---------------------------------------------------------
  # 2. Download Trivy (FIXED - dynamic latest release fetch)
  # ---------------------------------------------------------
  - task: PowerShell@2
    displayName: 'Download Trivy'
    inputs:
      targetType: 'inline'
      script: |
        $ErrorActionPreference = 'Stop'

        Write-Host "Fetching latest Trivy release info..."
        $release = Invoke-RestMethod -Uri "https://api.github.com/repos/aquasecurity/trivy/releases/latest" -Headers @{ "User-Agent" = "AzurePipelines" }
        $version = $release.tag_name.TrimStart('v')
        Write-Host "Latest Trivy version: $version"

        # Naye releases mein asset naam capital 'Windows' ke saath hota hai
        $assetName = "trivy_${version}_Windows-64bit.zip"
        $asset = $release.assets | Where-Object { $_.name -eq $assetName }

        if (-not $asset) {
            # fallback purane naming convention ke liye
            $assetName = "trivy_${version}_windows-64bit.zip"
            $asset = $release.assets | Where-Object { $_.name -eq $assetName }
        }

        if (-not $asset) {
            Write-Error "Trivy Windows asset ($assetName) nahi mila release $version mein."
            exit 1
        }

        $zipPath = "$(Build.SourcesDirectory)\trivy.zip"
        Write-Host "Downloading: $($asset.browser_download_url)"
        Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath -UseBasicParsing

        Write-Host "Extracting Trivy..."
        Expand-Archive -Path $zipPath -DestinationPath "$(trivyDir)" -Force

        Write-Host "Trivy successfully downloaded to $(trivyDir)"
      errorActionPreference: 'stop'
      failOnStderr: true

  # ---------------------------------------------------------
  # 3. Verify Trivy installed correctly
  # ---------------------------------------------------------
  - task: PowerShell@2
    displayName: 'Verify Trivy Installation'
    condition: succeeded()
    inputs:
      targetType: 'inline'
      script: |
        & "$(trivyDir)\trivy.exe" --version

  # ---------------------------------------------------------
  # 4. Run Trivy filesystem/IaC scan on repo
  # ---------------------------------------------------------
  - task: PowerShell@2
    displayName: 'Run Trivy Scan'
    condition: succeeded()
    inputs:
      targetType: 'inline'
      script: |
        & "$(trivyDir)\trivy.exe" fs --format table --output "$(Build.ArtifactStagingDirectory)\trivy-report.txt" "$(Build.SourcesDirectory)"

  # ---------------------------------------------------------
  # 5. Publish scan report as pipeline artifact
  # ---------------------------------------------------------
  - task: PublishBuildArtifacts@1
    displayName: 'Publish Trivy Report'
    condition: succeededOrFailed()
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)\trivy-report.txt'
      ArtifactName: 'trivy-scan-report'
      publishLocation: 'Container'
