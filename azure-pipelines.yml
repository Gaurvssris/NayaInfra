

trigger:
- main

pool:
  name: NayaInfra

variables:
  imageName: independence-day-app
  containerName: independence-day-app
  tag: latest

steps:

# Checkout Source
- checkout: self

# Download Trivy
- task: PowerShell@2
  displayName: Download Trivy
  inputs:
    targetType: inline
    script: |
      $ProgressPreference = 'SilentlyContinue'

      Invoke-WebRequest `
      -Uri "https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.65.0_windows-64bit.zip" `
      -OutFile "$(Agent.TempDirectory)\trivy.zip"

      Expand-Archive "$(Agent.TempDirectory)\trivy.zip" `
      -DestinationPath "$(Agent.TempDirectory)\trivy" -Force

      echo "##vso[task.prependpath]$(Agent.TempDirectory)\trivy"

      trivy.exe --version

# Scan Source Code
- task: PowerShell@2
  displayName: Trivy Filesystem Scan
  inputs:
    targetType: inline
    script: |
      trivy.exe fs `
      --severity HIGH,CRITICAL `
      --no-progress `
      "$(Build.SourcesDirectory)"

# Build Docker Image
- task: Docker@2
  displayName: Build Docker Image
  inputs:
    command: build
    repository: $(imageName)
    Dockerfile: '$(Build.SourcesDirectory)\independence-day-app\Dockerfile'
    buildContext: '$(Build.SourcesDirectory)\independence-day-app'
    tags: |
      $(tag)

# Scan Docker Image
- task: PowerShell@2
  displayName: Trivy Image Scan
  inputs:
    targetType: inline
    script: |
      trivy.exe image `
      --severity HIGH,CRITICAL `
      --no-progress `
      $(imageName):$(tag)
# Run New Container
- task: PowerShell@2
  displayName: Run Docker Container
  inputs:
    targetType: inline
    script: |
      docker run -d `
      --name $(containerName) `
      -p 8089:80 `
      $(imageName):$(tag)

# Verify
- task: PowerShell@2
  displayName: Verify Docker Container
  inputs:
    targetType: inline
    script: |
      docker ps
      docker images
