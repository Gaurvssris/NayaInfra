trigger:
- main

parameters:
- name: runDestroy
  displayName: 'Run Terraform Destroy instead of Apply/Plan'
  type: boolean
  default: false

pool:
  name: NayaInfra

variables:
  serviceConnection: 'NayaInfra'
  backendStorageAccount: 'gssstrg'
  backendContainer: 'gsscontainer'

##############################################
# DEV
##############################################

stages:

- stage: Dev
  displayName: DEV

  jobs:

  - job: TerraformDev

    steps:

    - checkout: self

    - task: TerraformInstaller@1
      displayName: Install Terraform
      inputs:
        terraformVersion: 'latest'

    - powershell: |
        $ErrorActionPreference = "Stop"

        # ---- tflint ----
        $tflintDir = "C:\tools\tflint"
        if (-not (Test-Path "$tflintDir\tflint.exe")) {
          New-Item -ItemType Directory -Force -Path $tflintDir | Out-Null
          Invoke-WebRequest -Uri "https://github.com/terraform-linters/tflint/releases/latest/download/tflint_windows_amd64.zip" -OutFile "$tflintDir\tflint.zip"
          Expand-Archive -Path "$tflintDir\tflint.zip" -DestinationPath $tflintDir -Force
          Remove-Item "$tflintDir\tflint.zip"
        }
        echo "##vso[task.prependpath]$tflintDir"

        # ---- tfsec ----
        $tfsecDir = "C:\tools\tfsec"
        if (-not (Test-Path "$tfsecDir\tfsec.exe")) {
          New-Item -ItemType Directory -Force -Path $tfsecDir | Out-Null
          Invoke-WebRequest -Uri "https://github.com/aquasecurity/tfsec/releases/latest/download/tfsec-windows-amd64.exe" -OutFile "$tfsecDir\tfsec.exe"
        }
        echo "##vso[task.prependpath]$tfsecDir"

        # ---- checkov (needs python/pip already on agent) ----
        pip install checkov --quiet
      displayName: Install Security Tools

    - powershell: |
        terraform version
        tflint --version
        tfsec --version
        checkov --version
      displayName: Verify Installed Tools

    - task: TerraformTask@5
      displayName: Terraform Init
      inputs:
        provider: azurerm
        command: init
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/Dev'
        backendServiceArm: '$(serviceConnection)'
        backendAzureRmStorageAccountName: '$(backendStorageAccount)'
        backendAzureRmContainerName: '$(backendContainer)'
        backendAzureRmKey: 'dev.tfstate'

    - task: TerraformTask@5
      displayName: Terraform Validate
      inputs:
        provider: azurerm
        command: validate
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/Dev'

    - powershell: |
        tflint --init
        tflint --minimum-failure-severity=error
      displayName: TFLint
      workingDirectory: '$(System.DefaultWorkingDirectory)/environment/Dev'

    - powershell: |
        tfsec .
      displayName: TFSEC
      workingDirectory: '$(System.DefaultWorkingDirectory)/environment/Dev'

    - powershell: |
        checkov -d . --soft-fail
      displayName: Checkov
      workingDirectory: '$(System.DefaultWorkingDirectory)/environment/Dev'

    - task: TerraformTask@5
      displayName: Terraform Plan
      condition: eq('${{ parameters.runDestroy }}', 'false')
      inputs:
        provider: azurerm
        command: plan
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/Dev'
        environmentServiceNameAzureRM: '$(serviceConnection)'

    - task: TerraformTask@5
      displayName: Terraform Apply
      condition: eq('${{ parameters.runDestroy }}', 'false')
      inputs:
        provider: azurerm
        command: apply
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/Dev'
        environmentServiceNameAzureRM: '$(serviceConnection)'

    - task: TerraformTask@5
      displayName: Terraform Destroy
      condition: eq('${{ parameters.runDestroy }}', 'true')
      inputs:
        provider: azurerm
        command: destroy
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/Dev'
        environmentServiceNameAzureRM: '$(serviceConnection)'

