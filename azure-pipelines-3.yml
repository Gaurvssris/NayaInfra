

trigger:
- main

pool:
  name: NayaInfra

variables:
  workingDir: '$(System.DefaultWorkingDirectory)/environment/Dev'

stages:

#==============================================================
# Stage-1 Validation & Security Scan
#==============================================================
- stage: Validation
  displayName: "Terraform Validation & Security"

  jobs:
  - job: Validate
    displayName: "Terraform Checks"

    steps:

    # Terraform Install
    - task: TerraformInstaller@1
      displayName: Install Terraform
      inputs:
        terraformVersion: '1.10.5'

    # Terraform Init
    - task: TerraformTask@5
      displayName: Terraform Init
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(workingDir)'
        backendServiceArm: 'NayaInfra'
        backendAzureRmStorageAccountName: 'gssstrg'
        backendAzureRmContainerName: 'gsscontainer'
        backendAzureRmKey: 'backup.tfstate'

    # Terraform Format
    # - task: TerraformTask@5
    #   displayName: Terraform Format
    #   inputs:
    #     provider: 'azurerm'
    #     command: 'custom'
    #     customCommand: 'fmt'
    #     commandOptions: '-recursive'
    #     workingDirectory: '$(workingDir)'

    # Terraform Validate
    - task: TerraformTask@5
      displayName: Terraform Validate
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(workingDir)'

    # Install TFLint
    - script: |
        choco install tflint -y
      displayName: Install TFLint

    # Run TFLint
    - script: |
        cd $(workingDir)
        tflint --init
        tflint
      displayName: Run TFLint

    # Install TFSec
    - script: |
        choco install tfsec -y
      displayName: Install TFSec

    # Run TFSec
    - script: |
        cd $(workingDir)
        tfsec .
      displayName: Run TFSec

    # Install Python
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.x'

    # Install Checkov
    - script: |
        pip install checkov
      displayName: Install Checkov

    # Run Checkov
    - script: |
        cd $(workingDir)
        checkov -d .
      displayName: Run Checkov

#==============================================================
# Stage-2 Manual Approval
#==============================================================

- stage: Approval
  displayName: "Manual Approval"

  dependsOn: Validation

  jobs:

  - deployment: Approval
    displayName: "Wait For Approval"

    environment: Production

    strategy:
      runOnce:
        deploy:
          steps:

          - script: |
              echo "Approval Completed"
            displayName: Approval Completed

#==============================================================
# Stage-3 Terraform Plan
#==============================================================

- stage: Plan
  displayName: "Terraform Plan"

  dependsOn: Approval

  jobs:

  - job: TerraformPlan
    displayName: Terraform Plan

    steps:

    - task: TerraformInstaller@1
      inputs:
        terraformVersion: '1.10.5'

    - task: TerraformTask@5
      displayName: Terraform Init
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(workingDir)'
        backendServiceArm: 'NayaInfra'
        backendAzureRmStorageAccountName: 'gssstrg'
        backendAzureRmContainerName: 'gsscontainer'
        backendAzureRmKey: 'backup.tfstate'

    - task: TerraformTask@5
      displayName: Terraform Plan
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(workingDir)'
        environmentServiceNameAzureRM: 'NayaInfra'
