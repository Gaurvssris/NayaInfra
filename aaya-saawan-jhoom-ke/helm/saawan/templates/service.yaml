apiVersion: v1
kind: Service

metadata:
  name: saawan-service
  namespace: {{ .Values.namespace }}

  labels:
    app: saawan

spec:
  type: {{ .Values.service.type }}

  selector:
    app: saawan

  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}