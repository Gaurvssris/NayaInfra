# Namespace
namespace: rain-app

# Replica Count
replicaCount: 2

# Docker Image
image:
  repository: gssdevacr.azurecr.io/saawan
  tag: "v1"
  pullPolicy: Always

# Image Pull Secret
imagePullSecrets: []
# Example:
# imagePullSecrets:
#   - name: acr-secret

# Deployment Name
nameOverride: ""
fullnameOverride: ""

# Container Port
containerPort: 80

# Service Configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 80

# Ingress Configuration
ingress:
  enabled: true
  className: nginx

  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /

  paths:
    - path: /
      pathType: Prefix

# Resource Limits
resources:
  limits:
    cpu: 500m
    memory: 512Mi

  requests:
    cpu: 100m
    memory: 128Mi

# Node Selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}